name: Publish portfolio to gh-pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build portrait assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/images
          base64 --decode .portrait-assets/p1-tiny.b64 > dist/images/mahdi-portrait-1.webp
          base64 --decode .portrait-assets/p2-tiny.b64 > dist/images/mahdi-portrait-2.webp
          base64 --decode .portrait-assets/p3-tiny.b64 > dist/images/mahdi-portrait-3.webp
          file dist/images/mahdi-portrait-1.webp
          file dist/images/mahdi-portrait-2.webp
          file dist/images/mahdi-portrait-3.webp

      - name: Bust static asset cache
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA::12}"
          sed -E -i "s#css/site-polish\.css\?v=[^\"]+#css/site-polish.css?v=${VERSION}#g" dist/index.html
          sed -E -i "s#js/main\.js\?v=[^\"]+#js/main.js?v=${VERSION}#g" dist/index.html
          sed -E -i "s#images/mahdi-portrait-([123])\.webp\?v=[^\"]+#images/mahdi-portrait-\1.webp?v=${VERSION}#g" dist/index.html

      - name: Publish dist to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+mahdi-1949@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          find /tmp/gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. /tmp/gh-pages/
          touch /tmp/gh-pages/.nojekyll
          cd /tmp/gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to publish."
            exit 0
          fi
          git commit -m "deploy: publish portfolio"
          git push origin HEAD:gh-pages
